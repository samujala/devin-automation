[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "superset-scanner"
version = "0.1.0"
description = "Static analysis scanner and Devin orchestrator for auto-remediable findings"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[project.scripts]
scanner = "scanner.scan:cli"
orchestrator = "orchestrator.run:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*", "orchestrator*", "api*"]
