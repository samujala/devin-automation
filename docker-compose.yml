services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/findings.db
      - DASHBOARD_ORIGIN=http://localhost:3000
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - DEVIN_API_KEY=${DEVIN_API_KEY:-}
      - DEVIN_API_BASE=${DEVIN_API_BASE:-https://api.devin.ai/v1}
      - DEVIN_DRY_RUN=false
      - MAX_CONCURRENT_SESSIONS=${MAX_CONCURRENT_SESSIONS:-3}
      - SESSION_TIMEOUT_SECONDS=${SESSION_TIMEOUT_SECONDS:-1800}
      - POLL_INTERVAL_GITHUB_SECONDS=${POLL_INTERVAL_GITHUB_SECONDS:-60}
      - POLL_INTERVAL_DEVIN_SECONDS=${POLL_INTERVAL_DEVIN_SECONDS:-30}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
